name: Relational HTTP Crash Recovery CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres:
    name: Kestrel SIGKILL + PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: idk_crash
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d idk_crash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDEMPOTENCYKIT_CRASH_PROVIDER: postgres
      IDEMPOTENCYKIT_CRASH_DB: Host=127.0.0.1;Port=5432;Database=idk_crash;Username=postgres;Password=testpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run live crash tests
        run: dotnet test dotnet/tests/IdempotencyKit.Relational.Crash.Tests -c Release --logger "console;verbosity=normal"

  sqlserver:
    name: Kestrel SIGKILL + SQL Server 2022
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SqlServerTest_Strong!2026"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    env:
      IDEMPOTENCYKIT_CRASH_PROVIDER: sqlserver
      IDEMPOTENCYKIT_CRASH_DB: "Server=127.0.0.1,1433;Database=master;User ID=sa;Password=SqlServerTest_Strong!2026;Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run live crash tests
        run: dotnet test dotnet/tests/IdempotencyKit.Relational.Crash.Tests -c Release --logger "console;verbosity=normal"
