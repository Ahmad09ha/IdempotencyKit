name: Build and PostgreSQL Integration CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET 10 + PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDEMPOTENCYKIT_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=testpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/IdempotencyKit.slnx
      - name: Build
        run: dotnet build dotnet/IdempotencyKit.slnx --configuration Release --no-restore
      - name: Test against real PostgreSQL
        run: dotnet test dotnet/IdempotencyKit.slnx --configuration Release --no-build

  typescript:
    name: NestJS 12 + PostgreSQL integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDEMPOTENCYKIT_TEST_POSTGRES_URL: postgresql://postgres:testpass@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Tests against real PostgreSQL
        run: npm test
